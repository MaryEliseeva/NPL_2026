# Конфигурация сервиса (блочный формат, не INI)
name    = "Демо-сервис \"Заметки\""
version = 1.4
debug   = true
owner   = null
motto   = Пишем быстро и без багов      // строка без кавычек — до конца строки

server {
    host = 0.0.0.0
    port = 8080
    tls  = false
    timeouts {                         # вложенный блок любой глубины
        read  = 30
        write = 15.5
    }
}

tags   = [web, "api, v2", 42, true]  // список; элемент с запятой — в кавычках
admins = [
    "anna@example.com",
    "boris@example.com"
]

limits = { rps = 100; burst = 250 }   # блок в одну строку, ; — разделитель

# повтор блока с тем же именем превращается в массив объектов
user { name = Анна;  role = admin }
user { name = Борис; role = guest; groups = [dev, ops] }
